<!doctype html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08191d">
<meta name="description" content="Výpravy Sira Šmika. Jedním tahem rozhoduj, lov prokleté bossy a vyšlechti vlastní výbavu.">
<title>NE, ALE ZABÍJÍM · Výpravy Sira Šmika</title>
<link rel="stylesheet" href="styles.css">
<script defer src="data.js"></script>
<script defer src="story.js"></script>
<script defer src="engine.js"></script>
<script defer src="game.js"></script>
</head>
<body>
<div class="game-shell" id="game">
<header class="topbar"><div><small class="eyebrow">VÝPRAVY SIRA ŠMIKA</small><h1>NE, ALE ZABÍJÍM</h1></div><button id="sound-button" class="icon-button" data-action="sound" aria-label="Zapnout zvuk">♪</button></header>
<div class="statusbar" id="statusbar"></div>
<main id="view" tabindex="-1"></main>
<nav class="bottom-tabs" aria-label="Herní části">
<button data-action="tab" data-value="map"><span>⌘</span>Mapa</button>
<button data-action="tab" data-value="road"><span>⚔</span>Výprava</button>
<button data-action="tab" data-value="character"><span>♙</span>Postava<i id="points-dot" hidden></i></button>
<button data-action="tab" data-value="inventory"><span>▦</span>Výbava</button>
</nav>
</div>
<div id="overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
